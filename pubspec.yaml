name: intent_app
description: "Intent login app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.10
  http: ^1.2.2
  google_fonts: ^6.0.0
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.1.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  file_picker: ^11.0.2
  camera: ^0.12.0+1
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#153C28"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/main_logo.png
    - assets/icons/new_apple.svg
    - assets/icons/new_google.svg
    - assets/icons/love_person.png
    - assets/images/demo_preview_photo.jpg
    - assets/images/demo_gallery_photo.jpg
    - assets/icons/rk.png
    - assets/icons/rk_1.png
